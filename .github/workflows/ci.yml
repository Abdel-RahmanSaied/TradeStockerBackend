name: Backend CI
# Each job sets up the pinned toolchains and runs one make target; the targets
# (Makefile, ci-*) are the same commands `make ci` runs locally. The job report
# (counts, skipped tests and suites CI does not run) goes to the job summary.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_OUT: ${{ github.workspace }}/.local/ci/results

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradestocker_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper_test -d tradestocker_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      # Format, vet and race tests; the PostgreSQL tests run against the
      # disposable service database above (a throwaway CI-only password).
      - run: make ci-go
        env:
          TEST_DATABASE_URL: postgres://paper_test:disposable_ci_only@127.0.0.1:5432/tradestocker_test_ci?sslmode=disable
      - if: always()
        run: make ci-report

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: make ci-python
      - if: always()
        run: make ci-report

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: make ci-docs
      - if: always()
        run: make ci-report

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so the secret scan sees every commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      - run: make ci-security

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      - run: make ci-package
