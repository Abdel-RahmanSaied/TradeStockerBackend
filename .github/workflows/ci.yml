name: Local paper backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradestocker_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper_test -d tradestocker_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      # uv (hash-checked) and the exact CPython from research/.python-version, in .tools/.
      - run: ./scripts/toolchain.sh
      - run: make check
      # Go race tests (PostgreSQL tests included) with the pinned research Python,
      # research package tests and launcher helper tests.
      - run: make test
        env:
          TEST_DATABASE_URL: postgres://paper_test:disposable_ci_only@127.0.0.1:5432/tradestocker_test_ci?sslmode=disable
      - run: make test-package
      # Both Go binaries, the research wheel, an installed-wheel import and smoke checks.
      - run: make build
      - run: ./scripts/package.sh "$RUNNER_TEMP/package"
      - run: python3 -B docs/tools/test_planctl.py
      - run: python3 -B test_install_docs.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
