name: Local paper backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradestocker_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paper_test -d tradestocker_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      - run: go vet ./...
      - run: go test -race -v ./...
        env:
          TEST_DATABASE_URL: postgres://paper_test:disposable_ci_only@127.0.0.1:5432/tradestocker_test_ci?sslmode=disable
      - run: python3 -B -m unittest discover -s research -p 'test_*.py'
      - run: python3 -B docs/tools/planctl.py validate
      - run: python3 -B docs/tools/planctl.py render --check
      - run: python3 -B docs/tools/test_planctl.py
      - run: python3 -B test_install_docs.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
