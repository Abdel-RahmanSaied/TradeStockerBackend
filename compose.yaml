name: tradestocker-local
services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: tradestocker_paper
      POSTGRES_USER: tradestocker
      POSTGRES_PASSWORD: ${TS_DB_PASSWORD:?Run scripts/setup-local.sh first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - paper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradestocker -d tradestocker_paper"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  paper_pgdata:
