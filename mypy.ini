# Python type check for product code (CI: make ci-python).
[mypy]
python_version = 3.14
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
files = research/src, research/parser_launcher.py, contracts/tools, fixtures/synthetic/generate.py, fixtures/synthetic/label.py, scripts/dev_stack_api.py

# The SEC parser stays byte-for-byte as reviewed (S07-T07). Its function
# bodies are unannotated, so here it is checked in mypy's default mode only.
[mypy-tradestocker_research.financials]
check_untyped_defs = False
